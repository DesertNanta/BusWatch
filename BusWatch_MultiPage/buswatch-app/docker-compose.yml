version: "3.9"

# ─────────────────────────────────────────────────────────────
# BusWatch — Docker Compose (Local Development)
# ─────────────────────────────────────────────────────────────
# Services:
#   db    — PostgreSQL 15 with PostGIS 3 extension
#   pgadmin — Optional: web UI for database inspection
#
# Usage:
#   Start database:  docker compose up -d db
#   Start all:       docker compose up -d
#   Stop:            docker compose down
#   Remove volumes:  docker compose down -v
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: buswatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: buswatch
      POSTGRES_PASSWORD: buswatch_secret
      POSTGRES_DB: buswatch
    ports:
      - "5432:5432"
    volumes:
      - buswatch_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buswatch -d buswatch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: buswatch_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@buswatch.local
      PGADMIN_DEFAULT_PASSWORD: admin_secret
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - buswatch_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  buswatch_pgdata:
    driver: local
  buswatch_pgadmin_data:
    driver: local
